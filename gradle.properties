# Project-wide Gradle settings

# AndroidX — required for all modern Android libraries
android.useAndroidX=true

# Enable Kotlin incremental compilation
kotlin.incremental=true

# KSP (Kotlin Symbol Processing) — needed for Room and Hilt codegen
ksp.incremental=true

# Increase heap for Kotlin compiler during large compilations
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m

# Enable Gradle Build Cache
org.gradle.caching=true

# Non-transitive R classes (recommended for all new projects)
android.nonTransitiveRClass=true

# Disable Jetifier (we use native AndroidX, no legacy support-lib)
android.enableJetifier=false
