[versions]
# ── SDK / toolchain ───────────────────────────────────────────────────────────
agp                     = "8.7.3"
kotlin                  = "2.1.0"
ksp                     = "2.1.0-1.0.29"

# ── AndroidX / Jetpack ────────────────────────────────────────────────────────
coreKtx                 = "1.15.0"
lifecycle               = "2.8.7"
activityCompose         = "1.10.0"
composeBom              = "2025.01.01"
navigationCompose       = "2.8.5"
room                    = "2.6.1"
workManager             = "2.10.0"
datastore               = "1.1.2"
securityCrypto          = "1.1.0-alpha06"

# ── DI ────────────────────────────────────────────────────────────────────────
hilt                    = "2.54"
hiltNavigationCompose   = "1.2.0"

# ── Network ───────────────────────────────────────────────────────────────────
retrofit                = "2.11.0"
okhttp                  = "4.12.0"
kotlinxSerialization    = "1.7.3"
retrofitKotlinxConverter = "1.0.0"

# ── Image loading ─────────────────────────────────────────────────────────────
coil                    = "3.0.4"

# ── Test ──────────────────────────────────────────────────────────────────────
junit                   = "4.13.2"
junitExt                = "1.2.1"
espresso                = "3.6.1"

[libraries]
# AndroidX core
androidx-core-ktx              = { group = "androidx.core",           name = "core-ktx",              version.ref = "coreKtx" }
androidx-lifecycle-runtime     = { group = "androidx.lifecycle",      name = "lifecycle-runtime-ktx",  version.ref = "lifecycle" }
androidx-lifecycle-viewmodel   = { group = "androidx.lifecycle",      name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose      = { group = "androidx.activity",       name = "activity-compose",       version.ref = "activityCompose" }

# Compose BOM (keeps all compose versions in sync)
compose-bom                    = { group = "androidx.compose",        name = "compose-bom",            version.ref = "composeBom" }
compose-ui                     = { group = "androidx.compose.ui",     name = "ui" }
compose-ui-graphics            = { group = "androidx.compose.ui",     name = "ui-graphics" }
compose-ui-tooling-preview     = { group = "androidx.compose.ui",     name = "ui-tooling-preview" }
compose-material3              = { group = "androidx.compose.material3", name = "material3" }
compose-icons-extended         = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-ui-tooling             = { group = "androidx.compose.ui",     name = "ui-tooling" }
compose-ui-test-manifest       = { group = "androidx.compose.ui",     name = "ui-test-manifest" }
compose-ui-test-junit4         = { group = "androidx.compose.ui",     name = "ui-test-junit4" }

# Navigation
navigation-compose             = { group = "androidx.navigation",     name = "navigation-compose",     version.ref = "navigationCompose" }

# Room
room-runtime                   = { group = "androidx.room",           name = "room-runtime",           version.ref = "room" }
room-ktx                       = { group = "androidx.room",           name = "room-ktx",               version.ref = "room" }
room-compiler                  = { group = "androidx.room",           name = "room-compiler",          version.ref = "room" }

# WorkManager
work-runtime-ktx               = { group = "androidx.work",           name = "work-runtime-ktx",       version.ref = "workManager" }
hilt-work                      = { group = "androidx.hilt",           name = "hilt-work",              version = "1.2.0" }
hilt-work-compiler             = { group = "androidx.hilt",           name = "hilt-compiler",          version = "1.2.0" }

# DataStore + Security
datastore-preferences          = { group = "androidx.datastore",      name = "datastore-preferences",  version.ref = "datastore" }
security-crypto                = { group = "androidx.security",       name = "security-crypto",        version.ref = "securityCrypto" }

# Hilt DI
hilt-android                   = { group = "com.google.dagger",       name = "hilt-android",           version.ref = "hilt" }
hilt-compiler                  = { group = "com.google.dagger",       name = "hilt-android-compiler",  version.ref = "hilt" }
hilt-navigation-compose        = { group = "androidx.hilt",           name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Retrofit + OkHttp
retrofit                       = { group = "com.squareup.retrofit2",  name = "retrofit",               version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxConverter" }
okhttp                         = { group = "com.squareup.okhttp3",    name = "okhttp",                 version.ref = "okhttp" }
okhttp-logging                 = { group = "com.squareup.okhttp3",    name = "logging-interceptor",    version.ref = "okhttp" }
kotlinx-serialization-json     = { group = "org.jetbrains.kotlinx",  name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Coil image loading
coil-compose                   = { group = "io.coil-kt.coil3",        name = "coil-compose",           version.ref = "coil" }
coil-network-okhttp            = { group = "io.coil-kt.coil3",        name = "coil-network-okhttp",    version.ref = "coil" }

# DocumentFile (SAF helper for writing to content:// URIs)
documentfile                   = { group = "androidx.documentfile",   name = "documentfile",           version = "1.0.1" }

# Test
junit                          = { group = "junit",                   name = "junit",                  version.ref = "junit" }
junit-ext                      = { group = "androidx.test.ext",       name = "junit",                  version.ref = "junitExt" }
espresso-core                  = { group = "androidx.test.espresso",  name = "espresso-core",          version.ref = "espresso" }

[plugins]
android-application            = { id = "com.android.application",               version.ref = "agp" }
kotlin-android                 = { id = "org.jetbrains.kotlin.android",           version.ref = "kotlin" }
kotlin-compose                 = { id = "org.jetbrains.kotlin.plugin.compose",    version.ref = "kotlin" }
kotlin-serialization           = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                           = { id = "com.google.dagger.hilt.android",         version.ref = "hilt" }
ksp                            = { id = "com.google.devtools.ksp",                version.ref = "ksp" }
