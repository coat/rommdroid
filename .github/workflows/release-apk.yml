name: Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  # Creating a Release in the web UI is the other way a version ships. The
  # publish steps below are idempotent, so if this and the tag push both fire
  # for one tag, whichever survives the concurrency group still does the job.
  release:
    types: [published]
  workflow_dispatch:

# Needed by the publish steps: creating releases, uploading assets, and moving
# the rolling main-latest tag.
permissions:
  contents: write

# One release build at a time; a newer push supersedes an in-flight one.
concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets are present
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=
          for v in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see .github/workflows/README-signing.md"
            exit 1
          fi

      # Gates everything below, so a tag or a direct push to main can't cut a
      # release from code whose tests fail. Merges from PRs have already run
      # this, but tag builds and direct pushes would otherwise skip it.
      # Deliberately ahead of the keystore decode: no reason to put the signing
      # key on disk for a build that is about to fail.
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

      # Decoded outside the workspace so it can never be picked up by a build
      # or swept into an uploaded artifact.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          chmod 600 "$RUNNER_TEMP/keystore.jks"

      - name: Build release APK
        env:
          # Monotonic per-repo counter, so each CI APK gets its own versionCode.
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Shred keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks"

      # AGP writes versionName/outputFile here, so we don't have to parse
      # build.gradle.kts to name the artifact.
      - name: Name the APK
        id: apk
        run: |
          meta=app/build/outputs/apk/release/output-metadata.json
          version=$(jq -r '.elements[0].versionName' "$meta")
          src=app/build/outputs/apk/release/$(jq -r '.elements[0].outputFile' "$meta")
          name="rommdroid-${version}-${GITHUB_SHA::7}.apk"
          mv "$src" "app/build/outputs/apk/release/$name"
          echo "version=$version"                                 >> "$GITHUB_OUTPUT"
          echo "name=$name"                                       >> "$GITHUB_OUTPUT"
          echo "path=app/build/outputs/apk/release/$name"          >> "$GITHUB_OUTPUT"

      - name: Verify the APK is signed
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --print-certs "${{ steps.apk.outputs.path }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      # Release assets download as-is, unlike the zipped artifact above, so
      # this is the link to open on a phone. Written to tolerate the release
      # already existing: a Release created in the web UI is already there by
      # the time this runs, and plain `gh release create` would fail on it.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "$APK" --clobber

      # Merges to main refresh a single rolling prerelease, so the newest main
      # build always has a stable, unzipped download URL. Marked --latest=false
      # so it never displaces a real version as the repo's "Latest release".
      - name: Publish rolling main build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
          TAG: main-latest
        run: |
          # Point the rolling tag at this commit. It doesn't match the 'v*'
          # trigger filter, so this push can't re-enter the workflow.
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"

          notes="Automatic build of main at ${GITHUB_SHA::7} — not a tagged version."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --latest=false \
              --title 'Latest main build' --notes "$notes"
          else
            gh release create "$TAG" --prerelease --latest=false \
              --title 'Latest main build' --notes "$notes"
          fi
          gh release upload "$TAG" "$APK" --clobber
