name: PR Debug APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# One debug build per PR; a new push supersedes the in-flight one.
concurrency:
  group: pr-debug-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No signing secrets here: the debug build type signs with the committed
      # app/debug.keystore, so this runs fine on PRs from forks. That key is
      # shared on purpose — see README-signing.md.
      - name: Build debug APK
        env:
          # Same monotonic counter the release workflow uses, so debug APKs
          # also get distinct versionCodes.
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      # AGP writes versionName/outputFile here, so we don't have to parse
      # build.gradle.kts to name the artifact.
      - name: Name the APK
        id: apk
        run: |
          meta=app/build/outputs/apk/debug/output-metadata.json
          version=$(jq -r '.elements[0].versionName' "$meta")
          src=app/build/outputs/apk/debug/$(jq -r '.elements[0].outputFile' "$meta")
          sha=${{ github.event.pull_request.head.sha || github.sha }}
          name="rommdroid-${version}-${sha::7}.apk"
          mv "$src" "app/build/outputs/apk/debug/$name"
          echo "name=$name"                              >> "$GITHUB_OUTPUT"
          echo "path=app/build/outputs/apk/debug/$name"  >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
