name: CodeQL

# Replaces GitHub's default ("automatic") code scanning setup, which could only
# ever analyze the Python icon script and the workflow files - 2% of the repo.
# Adding java-kotlin there fails: default setup runs autobuild with
# `-Dorg.gradle.java.home` pinned to temurin-17, and this app compiles at Java
# 21, so assemble dies on "invalid source release: 21" before a database
# exists. Default setup exposes no way to choose that JDK, hence this workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays at 07:00 UTC. Picks up newly published queries for code that has
    # not changed, which the push/PR triggers alone would never re-flag.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # required to upload the SARIF results

# One analysis per ref; a new push supersedes the in-flight one.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      # One language's failure should not hide another's findings.
      fail-fast: false
      matrix:
        include:
          # Neither of these compiles, so CodeQL reads them straight off disk.
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          # Kotlin has no buildless extractor - `build-mode: none` for
          # java-kotlin covers Java source only, and this repo has none, so it
          # finalizes an empty database and fails with "could not process any
          # code written in Java/Kotlin". Kotlin has to be observed being
          # compiled, so the steps below build the app for real.
          - language: java-kotlin
            build-mode: manual

    steps:
      - uses: actions/checkout@v4

      # The three steps below mirror pr-debug-apk.yml. They are what autobuild
      # gets wrong: JDK 21 rather than the 17 it forces, and an Android SDK,
      # which it never installs at all.
      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Must sit between init and analyze: the extractor only sees a compile
      # that happens while the database is open. Debug signs with the committed
      # app/debug.keystore, so no secrets are needed and forks work too.
      - name: Build the app for the extractor
        if: matrix.language == 'java-kotlin'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
